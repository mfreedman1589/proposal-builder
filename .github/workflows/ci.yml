# The test sweep on every push to dev, minus tests/run_all.py's LOCAL_ONLY
# files (real client fixtures, network, PowerPoint, the deck's fonts) -- those
# run locally in the nightly merge's step 1. The master decks and Supabase data
# are stand-ins built from the repo itself (tests/ci/deck_skeleton.py,
# tests/ci/stand_ins.py).
#
# The repo is public. This workflow references no secrets, uploads no
# artifacts, and blocks the network for the tests themselves
# (tests/ci/sitecustomize.py), so nothing it runs can reach Supabase.
name: CI

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        chunk: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # test_cross_module_refs reads git history
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build the stand-in decks
        run: python tests/ci/setup.py
      - name: Sweep (chunk ${{ matrix.chunk }} of 4)
        env:
          PYTHONPATH: ${{ github.workspace }}/tests/ci
        run: python tests/run_all.py --ci --chunk ${{ matrix.chunk }}/4
